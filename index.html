<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive explainers for medical subjects, one topic per page.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{color-scheme:light}</style>
<title>MedVisual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a clinical index. Subject directory on home, chapter lists inside a subject, one interactive explainer per page. ECG trace is the single recurring motif. */
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--fg:#12202E;--muted:#566879;--line:#DCE2E8;--line-strong:#B6C1CC;
  --accent:#B3261E;--accent-soft:#FBE9E7;--on-accent:#FFFFFF;
  --ok:#1B7F5C;--bad:#B3261E;--press:#C4372F;--vol:#2F6FB5;
  --blood-fill:#F2A3A0;--la-fill:#FCE8E6;--blood-line:#C4372F;
  --font-display:'Space Grotesk',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1620;--surface:#16212D;--fg:#E6EDF3;--muted:#9AABBB;--line:#243342;--line-strong:#36485A;
  --accent:#F0716A;--accent-soft:#3A1F22;--on-accent:#1A0B0C;
  --ok:#4CC39A;--bad:#F0716A;--press:#F0716A;--vol:#6BA7E8;
  --blood-fill:#9C3A3A;--la-fill:#3A2024;--blood-line:#F0716A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620;--surface:#16212D;--fg:#E6EDF3;--muted:#9AABBB;--line:#243342;--line-strong:#36485A;
  --accent:#F0716A;--accent-soft:#3A1F22;--on-accent:#1A0B0C;
  --ok:#4CC39A;--bad:#F0716A;--press:#F0716A;--vol:#6BA7E8;
  --blood-fill:#9C3A3A;--la-fill:#3A2024;--blood-line:#F0716A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:960px;margin:0 auto}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:500;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,44px);letter-spacing:-0.02em}
h2{font-size:20px}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px var(--font-display);letter-spacing:-0.01em}
.brand svg{width:34px;height:18px;flex:none}
.brand path{stroke:var(--accent)}
.top small{font:12px var(--font-mono);color:var(--muted)}

.hero{display:flex;flex-direction:column;gap:12px;padding:40px 0 20px}
.hero p{color:var(--muted);max-width:52ch}
.trace{width:100%;height:44px;display:block;margin:8px 0 28px}
.trace path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:112px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none}
.card:hover{border-color:var(--accent)}
.card b{font:500 17px/1.25 var(--font-display)}
.meta{font:12px var(--font-mono);color:var(--muted)}
.card.live .meta{color:var(--accent)}
.card.empty{border-style:dashed;background:transparent}
.card.empty b{color:var(--muted)}

.crumbs{display:flex;flex-wrap:wrap;gap:6px;padding:20px 0 4px;font:13px var(--font-mono);color:var(--muted)}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--accent)}
.head{display:flex;flex-direction:column;gap:8px;padding:12px 0 24px}
.head p{color:var(--muted);max-width:60ch}
.chapter{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.chapter h2{font-size:15px;font-family:var(--font-mono);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none}
.row:hover{border-color:var(--accent)}
.row span{min-width:0}.row b{display:block;font:500 17px var(--font-display)}
.row small{color:var(--muted);font-size:14px}
.row i{font-style:normal;color:var(--accent);font:500 18px var(--font-mono)}
.none{padding:18px 16px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted);font-size:15px}
.note{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

.explainer{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);grid-template-areas:"ctl" "heart" "stats" "plot"}
.ctl{grid-area:ctl;display:flex;flex-direction:column;gap:10px}
.heart{grid-area:heart;max-width:480px;width:100%;margin:0 auto}
.stats{grid-area:stats;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.plot{grid-area:plot;max-width:640px;width:100%;margin:0 auto}
@media (min-width:860px){
  .explainer{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"ctl heart" "stats heart" "plot plot";column-gap:32px}
}
.pills{display:flex;gap:6px}
.pill{flex:1;min-width:0;min-height:44px;padding:0;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:8px;font:500 15px var(--font-mono);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.line h3{font-size:20px}
.btn{flex:none;min-height:40px;padding:0 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:8px;font:500 14px var(--font-body);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.desc{color:var(--muted);font-size:15px;line-height:1.55;min-height:70px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat small{display:block;font:11px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.stat b{font:500 17px var(--font-display)}
.cap{font:12px var(--font-mono);color:var(--muted);margin-top:6px}

svg text{font-family:var(--font-body)}
.ts{fill:var(--muted);font-size:12px}
.box{fill:var(--surface);stroke:var(--line-strong);stroke-width:.75}
.la{fill:var(--la-fill);stroke:var(--blood-line);stroke-width:.75}
.blood{fill:var(--blood-fill)}
#blood{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){#blood{transition:transform .9s ease}}
.arr{fill:none;stroke:var(--press);stroke-width:1.5}
.pl-p{fill:none;stroke:var(--press);stroke-width:2;stroke-linejoin:round}
.pl-v{fill:none;stroke:var(--vol);stroke-width:2;stroke-linejoin:round}
.pl-e{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round}
.pl-ax{stroke:var(--line-strong);stroke-width:.75}
.band{fill:var(--accent-soft)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#" aria-label="MedVisual home">
      <svg viewBox="0 0 34 18" aria-hidden="true"><path d="M0 12 H8 L11 8 L14 12 H17 L19 2 L23 17 L26 12 H34" fill="none" stroke-width="2" stroke-linejoin="round"/></svg>
      MedVisual
    </a>
    <small id="count"></small>
  </header>
  <main id="app"></main>
</div>

<script>
var SUBJECTS=[
  {id:'anatomy',name:'Anatomy',chapters:[]},
  {id:'psychiatry',name:'Psychiatry',chapters:[]},
  {id:'biochemistry',name:'Biochemistry',chapters:[]},
  {id:'dermatology',name:'Dermatology',chapters:[]},
  {id:'opds',name:'OPDs',chapters:[]},
  {id:'community-medicine',name:'Community Medicine',chapters:[]},
  {id:'physiology',name:'Physiology',chapters:[
    {name:'Cardiovascular system',pages:[
      {id:'physiology-cardiac-cycle',title:'Cardiac cycle',blurb:'Valves, pressure, volume and ECG across the seven phases.'}
    ]}
  ]},
  {id:'ophthalmology',name:'Ophthalmology',chapters:[]},
  {id:'pediatrics',name:'Pediatrics',chapters:[]},
  {id:'obstetrics-gynecology',name:'Obstetrics and Gynecology',chapters:[]},
  {id:'clinical-postings',name:'Clinical Postings',chapters:[]},
  {id:'surgery-allied',name:'Surgery and allied subjects',chapters:[]},
  {id:'radiology',name:'Radiology',chapters:[]},
  {id:'forensic-medicine',name:'Forensic Medicine',chapters:[]},
  {id:'anesthesiology',name:'Anesthesiology',chapters:[]},
  {id:'microbiology',name:'Microbiology',chapters:[]},
  {id:'pathology',name:'Pathology',chapters:[]},
  {id:'pharmacology',name:'Pharmacology',chapters:[]},
  {id:'ent',name:'ENT',chapters:[]}
];
var PAGES={'physiology-cardiac-cycle':cardiacCycle};
var app=document.getElementById('app'),cleanup=null;

function pageCount(s){return s.chapters.reduce(function(n,c){return n+c.pages.length},0)}
function plural(n){return n+(n===1?' page':' pages')}

function ecgPath(){
  var d='M0 30',x=0;
  for(var i=0;i<3;i++){
    d+=' H'+(x+20)+' q8 -8 16 0 h10 l4 4 l8 -26 l8 30 l4 -8 h14 q16 -12 32 0';
    x+=20+16+10+4+8+8+4+14+32+60;
    d+=' H'+x;
  }
  return d+' H600';
}

function showHome(){
  var live=SUBJECTS.reduce(function(n,s){return n+pageCount(s)},0);
  var h='<section class="hero"><h1>Interactive explainers for every subject</h1>'
   +'<p>Pick a subject. Each topic is one page you can tap through instead of reading.</p></section>'
   +'<svg class="trace" viewBox="0 0 600 44" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="'+ecgPath()+'"/></svg>'
   +'<div class="grid">';
  SUBJECTS.forEach(function(s){
    var n=pageCount(s);
    h+='<a class="card '+(n?'live':'empty')+'" href="#'+s.id+'"><b>'+s.name+'</b><span class="meta">'+(n?plural(n):'Coming soon')+'</span></a>';
  });
  h+='</div><p class="note">For study. Check clinical values against your standard textbooks.</p>';
  app.innerHTML=h;
  document.getElementById('count').textContent=SUBJECTS.length+' subjects · '+plural(live);
}

function showSubject(s){
  var h='<nav class="crumbs" aria-label="Breadcrumb"><a href="#">All subjects</a><span>/</span><span>'+s.name+'</span></nav>'
   +'<div class="head"><h1>'+s.name+'</h1><p>'+(pageCount(s)?plural(pageCount(s))+' so far.':'Nothing here yet.')+'</p></div>';
  if(!s.chapters.length){
    h+='<div class="none">No pages yet. Topics for '+s.name+' appear here as they are added.</div>';
  }
  s.chapters.forEach(function(c){
    h+='<section class="chapter"><h2>'+c.name+'</h2>';
    c.pages.forEach(function(p){
      h+='<a class="row" href="#'+p.id+'"><span><b>'+p.title+'</b><small>'+p.blurb+'</small></span><i aria-hidden="true">→</i></a>';
    });
    h+='</section>';
  });
  app.innerHTML=h;
}

function showPage(s,c,p){
  app.innerHTML='<nav class="crumbs" aria-label="Breadcrumb"><a href="#">All subjects</a><span>/</span><a href="#'+s.id+'">'+s.name+'</a><span>/</span><span>'+c.name+'</span></nav>'
   +'<div class="head"><h1>'+p.title+'</h1><p>'+p.blurb+'</p></div><div id="stage"></div>'
   +'<p class="note">Values are typical textbook figures at about 75 beats per minute. Check them against your standard physiology text before relying on them.</p>';
  cleanup=PAGES[p.id](document.getElementById('stage'))||null;
}

function route(){
  if(cleanup){cleanup();cleanup=null}
  var key='';
  try{key=decodeURIComponent((location.hash||'').replace(/^#/,''))}catch(e){}
  var i,j,k,s,c,p;
  for(i=0;i<SUBJECTS.length;i++){if(SUBJECTS[i].id===key){showSubject(SUBJECTS[i]);window.scrollTo(0,0);return}}
  for(i=0;i<SUBJECTS.length;i++){s=SUBJECTS[i];
    for(j=0;j<s.chapters.length;j++){c=s.chapters[j];
      for(k=0;k<c.pages.length;k++){p=c.pages[k];
        if(p.id===key&&PAGES[key]){showPage(s,c,p);window.scrollTo(0,0);return}}}}
  showHome();window.scrollTo(0,0);
}

function cardiacCycle(root){
  var P=[6,10,80,120,100,4,5,6],V=[105,120,120,73,50,50,95,105];
  var ph=[
    {n:'Atrial systole',d:'The atria contract and top up the ventricle with the last 10 to 20% of filling. Mitral open, aortic closed.',ecg:'P wave',s:'S4 (abnormal)',mo:1,ao:0,c:'la'},
    {n:'Isovolumetric contraction',d:'The ventricle contracts with both valves shut. Pressure climbs steeply at constant volume. The mitral valve closes (S1).',ecg:'QRS complex',s:'S1',mo:0,ao:0,c:'lv'},
    {n:'Rapid ejection',d:'LV pressure exceeds aortic pressure, the aortic valve opens, and most of the stroke volume leaves.',ecg:'ST segment',s:'None',mo:0,ao:1,c:'lv'},
    {n:'Reduced ejection',d:'Ejection slows as the ventricle repolarises. Flow continues by momentum even as LV pressure dips below aortic.',ecg:'T wave',s:'None',mo:0,ao:1,c:'lv'},
    {n:'Isovolumetric relaxation',d:'The aortic valve closes (S2, dicrotic notch). Both valves are shut while pressure falls at end-systolic volume.',ecg:'T wave ends',s:'S2',mo:0,ao:0,c:''},
    {n:'Rapid filling',d:'LV pressure drops below atrial pressure, the mitral valve opens, and blood rushes in. S3 is normal in children.',ecg:'TP segment',s:'S3 (normal in kids)',mo:1,ao:0,c:''},
    {n:'Diastasis',d:'Slow filling as pressures equalise. This phase shrinks first when heart rate rises.',ecg:'TP segment',s:'None',mo:1,ao:0,c:''}
  ];
  var F1=[1,0,0,0,0,1,0.5],F2=[0,0,1,0.6,0,0,0];
  var dur=[0.10,0.05,0.10,0.15,0.08,0.10,0.22],xs=[30];
  dur.forEach(function(d){xs.push(xs[xs.length-1]+d/0.8*340)});
  function y(v){return 100-v*0.62}
  function g(id){return root.querySelector('#'+id)}
  function rg(a,b){return a===b?String(a):a+' → '+b}

  root.innerHTML=
  '<div class="explainer">'
  +'<div class="ctl"><div class="pills" id="pills"></div>'
  +'<div class="line"><h3 id="name"></h3><button class="btn" id="play" type="button">Play</button></div>'
  +'<p class="desc" id="desc"></p></div>'
  +'<div class="heart"><svg viewBox="0 0 380 230" width="100%" role="img"><title>Left heart schematic</title><desc>Left atrium, left ventricle and aorta, with mitral and aortic valves that open and close as the phase changes, and the ventricle filling and emptying.</desc>'
  +'<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>'
  +'<rect id="la" class="la" x="70" y="15" width="150" height="70" rx="24"/>'
  +'<text class="ts" x="145" y="50" text-anchor="middle" dominant-baseline="central">LA</text>'
  +'<rect class="box" x="270" y="15" width="32" height="92" rx="6"/>'
  +'<text class="ts" x="310" y="55" dominant-baseline="central">Aorta</text>'
  +'<rect id="lvo" class="box" x="70" y="105" width="220" height="115" rx="18"/>'
  +'<rect id="blood" class="blood" x="74" y="109" width="212" height="107" rx="14"/>'
  +'<text class="ts" x="36" y="165" text-anchor="middle" dominant-baseline="central">LV</text>'
  +'<text class="ts" x="182" y="95" dominant-baseline="central">MV</text>'
  +'<text class="ts" x="262" y="95" text-anchor="end" dominant-baseline="central">AV</text>'
  +'<line id="f0" x1="14" y1="50" x2="66" y2="50" class="arr" marker-end="url(#arrow)" opacity="0.6"/>'
  +'<line id="f1" x1="145" y1="62" x2="145" y2="150" class="arr" marker-end="url(#arrow)"/>'
  +'<line id="f2" x1="286" y1="170" x2="286" y2="30" class="arr" marker-end="url(#arrow)"/>'
  +'<line id="mvL" x1="115" y1="95" x2="130" y2="95" stroke-width="5"/><line id="mvC" x1="130" y1="95" x2="160" y2="95" stroke-width="5"/><line id="mvR" x1="160" y1="95" x2="175" y2="95" stroke-width="5"/>'
  +'<line id="avL" x1="270" y1="105" x2="280" y2="105" stroke-width="5"/><line id="avC" x1="280" y1="105" x2="292" y2="105" stroke-width="5"/><line id="avR" x1="292" y1="105" x2="302" y2="105" stroke-width="5"/>'
  +'</svg></div>'
  +'<div class="stats">'
  +'<div class="stat"><small>LV pressure, mmHg</small><b id="mp"></b></div>'
  +'<div class="stat"><small>LV volume, mL</small><b id="mv"></b></div>'
  +'<div class="stat"><small>Mitral valve</small><b id="mm"></b></div>'
  +'<div class="stat"><small>Aortic valve</small><b id="ma"></b></div>'
  +'<div class="stat"><small>ECG</small><b id="me" style="font-size:15px"></b></div>'
  +'<div class="stat"><small>Heart sound</small><b id="ms" style="font-size:15px"></b></div>'
  +'</div>'
  +'<div class="plot"><svg viewBox="0 0 380 172" width="100%" role="img"><title>Wiggers diagram</title><desc>Schematic left ventricular pressure, left ventricular volume and ECG across the seven phases of the cardiac cycle, with the selected phase highlighted.</desc><g id="pg"></g></svg>'
  +'<p class="cap">Schematic, timings drawn to scale for a 0.8 s cycle.</p></div>'
  +'</div>';

  var pills=g('pills'),cur=0,timer=null;
  ph.forEach(function(p,i){
    var b=document.createElement('button');
    b.type='button';b.className='pill';b.textContent=i+1;
    b.setAttribute('aria-label','Phase '+(i+1)+': '+p.n);
    b.onclick=function(){stop();render(i)};
    pills.appendChild(b);
  });

  var h='<rect class="band" id="band" y="16" height="130" x="30" width="40"/>';
  h+='<line class="pl-ax" x1="30" y1="100" x2="370" y2="100"/>';
  h+='<line class="pl-p" x1="30" y1="8" x2="44" y2="8"/><text class="ts" x="48" y="8" dominant-baseline="central">LV pressure (mmHg)</text>';
  h+='<line class="pl-v" x1="190" y1="8" x2="204" y2="8"/><text class="ts" x="208" y="8" dominant-baseline="central">LV volume (mL)</text>';
  h+='<polyline class="pl-p" points="'+P.map(function(v,i){return xs[i].toFixed(1)+','+y(v).toFixed(1)}).join(' ')+'"/>';
  h+='<polyline class="pl-v" points="'+V.map(function(v,i){return xs[i].toFixed(1)+','+y(v).toFixed(1)}).join(' ')+'"/>';
  var b0=128;
  var e='M'+xs[0]+' '+b0+' L'+(xs[0]+4)+' '+b0+' Q'+(xs[0]+16)+' '+(b0-12)+' '+(xs[0]+28)+' '+b0+' L'+xs[1]+' '+b0+' L'+(xs[1]+3)+' '+(b0+4)+' L'+(xs[1]+10)+' '+(b0-28)+' L'+(xs[1]+17)+' '+(b0+8)+' L'+xs[2]+' '+b0+' L'+(xs[3]+14)+' '+b0+' Q'+(xs[3]+39)+' '+(b0-28)+' '+xs[4]+' '+b0+' L'+xs[7]+' '+b0;
  h+='<path class="pl-e" d="'+e+'"/>';
  h+='<text class="ts" x="0" y="'+b0+'" dominant-baseline="central">ECG</text>';
  for(var i=0;i<7;i++){h+='<text class="ts" id="n'+i+'" x="'+((xs[i]+xs[i+1])/2).toFixed(1)+'" y="158" text-anchor="middle" dominant-baseline="central">'+(i+1)+'</text>'}
  h+='<circle id="d1" r="4" style="fill:var(--press)"/><circle id="d2" r="4" style="fill:var(--vol)"/>';
  g('pg').innerHTML=h;

  function valve(p,o){
    g(p+'C').style.display=o?'none':'';
    ['L','C','R'].forEach(function(s){g(p+s).style.stroke=o?'var(--ok)':'var(--bad)'});
  }
  function render(i){
    cur=i;var p=ph[i];
    Array.prototype.forEach.call(pills.children,function(b,k){b.setAttribute('aria-pressed',k===i?'true':'false')});
    g('name').textContent=(i+1)+'. '+p.n;
    g('desc').textContent=p.d;
    g('mp').textContent=rg(P[i],P[i+1]);
    g('mv').textContent=rg(V[i],V[i+1]);
    var mm=g('mm'),ma=g('ma');
    mm.textContent=p.mo?'Open':'Closed';mm.style.color=p.mo?'var(--ok)':'var(--bad)';
    ma.textContent=p.ao?'Open':'Closed';ma.style.color=p.ao?'var(--ok)':'var(--bad)';
    g('me').textContent=p.ecg;g('ms').textContent=p.s;
    valve('mv',p.mo);valve('av',p.ao);
    g('blood').style.transform='scaleY('+Math.max(0.02,V[i+1]/130)+')';
    g('f1').setAttribute('opacity',F1[i]);g('f2').setAttribute('opacity',F2[i]);
    ['la','lvo'].forEach(function(id){
      var el=g(id),on=(id==='la'&&p.c==='la')||(id==='lvo'&&p.c==='lv');
      el.style.stroke=on?'var(--accent)':'';el.style.strokeWidth=on?'2.5':'';
    });
    var bd=g('band');bd.setAttribute('x',xs[i]);bd.setAttribute('width',xs[i+1]-xs[i]);
    var xm=(xs[i]+xs[i+1])/2;
    g('d1').setAttribute('cx',xm);g('d1').setAttribute('cy',y((P[i]+P[i+1])/2));
    g('d2').setAttribute('cx',xm);g('d2').setAttribute('cy',y((V[i]+V[i+1])/2));
    for(var k=0;k<7;k++){var n=g('n'+k);n.style.fill=k===i?'var(--accent)':'';n.style.fontWeight=k===i?'500':'400'}
  }
  function setBtn(on){g('play').textContent=on?'Pause':'Play'}
  function stop(){if(timer){clearInterval(timer);timer=null}setBtn(false)}
  g('play').onclick=function(){
    if(timer){stop();return}
    setBtn(true);
    timer=setInterval(function(){render((cur+1)%7)},1900);
  };
  render(0);
  return function(){if(timer){clearInterval(timer);timer=null}};
}

window.addEventListener('hashchange',route);
route();
</script>
